<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img"
     aria-label="Schematická mapa: území Prahy a okruh 20 km kolem Berouna s obcemi, kam trenérka dojíždí">
  <!-- PLACEHOLDER — nahradit exportem z Figmy (uzel „Mapa / Praha + 20 km od Berouna“, text v křivkách) -->
  <rect width="560" height="400" rx="16" fill="#F6F4F0"/>
  <rect x="0.5" y="0.5" width="559" height="399" rx="16" fill="none" stroke="#E5E1DA"/>

  <!-- Berounka -->
  <path d="M120 268c48 6 84-14 126-32 46-20 88-42 150-52"
        fill="none" stroke="#D9D4CC" stroke-width="6" stroke-linecap="round"/>

  <!-- Praha -->
  <path d="M372 68c34-8 68 2 84 26 16 24 12 56-8 76-22 22-58 28-86 14-26-13-40-42-32-70 6-22 20-40 42-46Z"
        fill="#E9E5DE" stroke="#D6D0C6" stroke-width="1.5"/>
  <text x="420" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" fill="#131316">PRAHA</text>
  <text x="420" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="12" fill="#66646B">celé území</text>

  <!-- okruh 20 km kolem Berouna -->
  <circle cx="196" cy="250" r="112" fill="#D62828" fill-opacity="0.06"
          stroke="#D62828" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M196 250h112" stroke="#D62828" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="252" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#D62828">20 km</text>

  <!-- Beroun -->
  <circle cx="196" cy="250" r="7" fill="#D62828"/>
  <text x="196" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#131316">BEROUN</text>

  <!-- obce -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#66646B">
    <circle cx="152" cy="262" r="3.5" fill="#A8A6AE"/><text x="146" y="279" text-anchor="end">Králův Dvůr</text>
    <circle cx="112" cy="240" r="3.5" fill="#A8A6AE"/><text x="106" y="234" text-anchor="end">Zdice</text>
    <circle cx="122" cy="310" r="3.5" fill="#A8A6AE"/><text x="116" y="326" text-anchor="end">Hořovice</text>
    <circle cx="292" cy="206" r="3.5" fill="#A8A6AE"/><text x="300" y="202">Rudná</text>
    <circle cx="272" cy="316" r="3.5" fill="#A8A6AE"/><text x="280" y="330">Řevnice</text>
    <circle cx="306" cy="292" r="3.5" fill="#A8A6AE"/><text x="314" y="296">Dobřichovice</text>
  </g>
</svg>
