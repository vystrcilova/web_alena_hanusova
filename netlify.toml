# Konfigurace pro Netlify.
# Netlify neběží na Apachi, takže .htaccess se tam neuplatní — bezpečnostní
# hlavičky a cache se musí nastavit tady. Přesměrování na https a z www na
# doménu bez www a vystavení certifikátu řeší Netlify samo podle nastavení
# primární domény, proto tu žádná redirect pravidla nejsou.

[build]
  # Web je statický, nic se nesestavuje. Publikuje se koren repozitáře,
  # kde leží index.html.
  publish = "."

# Netlify automaticky použije /404.html pro neexistující adresy.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Obrázky, CSS a JS: hodinová cache. Po hodině se prohlídač zeptá, Netlify
# odpoví ETagem "nezměnilo se" (HTTP 304, pár set bajtů) a stahuje jen to, co
# se opravdu změnilo. Díky tomu se každá úprava rozšíří sama a zvyšování ?v=
# v HTML není povinné — zůstává jen jako páka pro okamžité vynucení.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Písma jsou výjimka: názvy souborů se nikdy nemění, takže pod stejnou adresou
# nikdy nebude jiný obsah. Proto rok a immutable.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
