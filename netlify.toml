# Konfigurace pro Netlify.
# Netlify neběží na Apachi, takže .htaccess se tam neuplatní — bezpečnostní
# hlavičky a cache se musí nastavit tady. Přesměrování na https a z www na
# doménu bez www a vystavení certifikátu řeší Netlify samo podle nastavení
# primární domény, proto tu žádná redirect pravidla nejsou.

[build]
  # Web je statický, nic se nesestavuje. Publikuje se koren repozitáře,
  # kde leží index.html.
  publish = "."

# Netlify automaticky použije /404.html pro neexistující adresy.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Assety mají v odkazech verzi (?v=2026-09), takže je roční cache bezpečná.
# POZOR: po výměně obrázku nebo úpravě CSS je nutné tu verzi v HTML zvýšit,
# jinak vracejícím se návštěvníkům zůstane rok stará podoba.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Písma mají verzi v názvu souboru, takže se nikdy nemění pod stejnou adresou.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
